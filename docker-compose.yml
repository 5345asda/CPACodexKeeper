services:
  cpacodexkeeper:
    build: .
    container_name: cpacodexkeeper
    restart: unless-stopped
    command: ["daemon", "--config", "/app/config.toml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CPA_ENDPOINT: ${CPA_ENDPOINT:?CPA_ENDPOINT must be set in .env or the shell}
      CPA_TOKEN: ${CPA_TOKEN:?CPA_TOKEN must be set in .env or the shell}
      CPA_PROXY: ${CPA_PROXY:-}
    volumes:
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD", "cpa-keeper", "doctor", "--config", "/app/config.toml"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - shared

networks:
  shared:
    external: true
